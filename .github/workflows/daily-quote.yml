name: Update Daily Quote

on:
  schedule:
    - cron: '0 0 * * *' # רץ בכל יום בחצות
  workflow_dispatch: # מאפשר לך להריץ את זה גם ידנית

jobs:
  update-quote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Get Quote
        run: |
          QUOTE=$(curl -s https://api.quotable.io/random?tags=technology)
          TEXT=$(echo $QUOTE | jq -r '.content')
          AUTHOR=$(echo $QUOTE | jq -r '.author')
          echo "### 💡 ציטוט טכנולוגי יומי" > quote.md
          echo "> $TEXT - **$AUTHOR**" >> quote.md
      
      - name: Update README
        run: |
          # כאן אנחנו משלבים את הציטוט לתוך ה-README
          cat quote.md >> README.md
          
      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git commit -am "Update daily quote"
          git push
