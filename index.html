<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הפרופיל של שחר גבאי</title>
    
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/689/689304.png" type="image/png">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.2.0/github-markdown-dark.min.css">
    
    <style>
        :root {
            --bg-color: #0d1117;
        }
        body {
            background-color: var(--bg-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        }
        /* כותרת אפקט ההקלדה */
        #typing-title {
            color: #58a6ff;
            font-size: 2rem;
            margin-bottom: 30px;
            min-height: 1.2em;
            text-align: center;
            font-weight: 600;
        }
        /* מיכל התוכן הראשי */
        .markdown-body {
            box-sizing: border-box;
            min-width: 200px;
            max-width: 980px;
            width: 100%;
            padding: 45px;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        /* התאמה לניידים */
        @media (max-width: 767px) {
            .markdown-body {
                padding: 15px;
            }
            #typing-title {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <h1 id="typing-title"></h1>

    <article id="content" class="markdown-body">
        <p style="text-align: center;">טוען את הפרופיל הדינמי...</p>
    </article>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <script>
        // 1. אפקט הקלדה
        const titleText = "ברוכים הבאים לעולם הטכנולוגי של שחר גבאי";
        let index = 0;
        function typeWriter() {
            if (index < titleText.length) {
                document.getElementById("typing-title").innerHTML += titleText.charAt(index);
                index++;
                setTimeout(typeWriter, 70);
            }
        }

        // 2. טעינת ה-README והצגתו
        async function loadProfile() {
            try {
                // מוסיפים Timestamp כדי למנוע Cache ולוודא שהציטוט היומי מתעדכן
                const response = await fetch('README.md?t=' + new Date().getTime());
                const markdown = await response.text();
                document.getElementById('content').innerHTML = marked.parse(markdown);
                // מתחילים את אפקט ההקלדה רק אחרי שהתוכן נטען
                typeWriter();
            } catch (err) {
                document.getElementById('content').innerHTML = "שגיאה בטעינת הפרופיל.";
                console.error(err);
            }
        }

        loadProfile();
    </script>
</body>
</html>
